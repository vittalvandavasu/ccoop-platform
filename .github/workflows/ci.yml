name: Commercial correctness
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ccoop
          POSTGRES_PASSWORD: ccoop
          POSTGRES_DB: ccoop_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U ccoop" --health-interval 3s --health-retries 15
    env:
      DATABASE_URL: postgres://ccoop:ccoop@localhost:5432/ccoop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
