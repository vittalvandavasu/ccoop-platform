name: Commercial correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ccoop
          POSTGRES_PASSWORD: ccoop
          POSTGRES_DB: ccoop_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U ccoop" --health-interval 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 15
    env:
      DATABASE_URL: postgres://ccoop:ccoop@localhost:5432/ccoop_test
      REDIS_URL: redis://localhost:6379
      PAYMENT_PROVIDER: simulator
      DEV_AUTH: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate and seed twice
        run: |
          npm run db:seed
          npm run db:seed
      - run: npm run typecheck
      - name: Domain and provider fixtures on PostgreSQL
        run: npm test
      - name: Deliberately overlapping PostgreSQL transactions and real Redis worker
        run: npm run test:native
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Chromium simulator journey (separate PGlite database)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/
            test-results/
          retention-days: 14
